<!DOCTYPE html>
<html lang="en" data-theme="menopause">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>Design OS</title>

<!-- Set the color mode before first paint, so a dark session does not flash
     light. Mirrors the default in launcher.js (auto = follow the OS). -->
<script>
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('launcher.mode') || 'auto'; } catch (e) {}
  var dark = pref === 'dark' ||
    (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-mode-pref', pref);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,600;0,700;1,400&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- Universal tokens, the site hue family, then the launcher's own chrome.
     The chrome is built from neutrals only; the brand hue appears in the Color
     section as subject matter, not as furniture. -->
<link rel="stylesheet" href="system/tokens/tokens.css" />
<link rel="stylesheet" href="system/tokens/themes/menopause.css" />
<link rel="stylesheet" href="launcher/launcher.css" />
</head>

<body data-rail="expanded">
<div class="shell">

  <nav class="rail" aria-label="Sections">
    <div class="rail__head">
      <span class="rail__name">Design OS</span>
      <button class="rail__toggle" id="rail-toggle" type="button" aria-expanded="true" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-13ZM9 3v18"/>
        </svg>
      </button>
    </div>

    <div class="rail__nav" id="rail-nav"></div>

    <div class="rail__foot">
      <div class="modes" id="modes" role="group" aria-label="Color mode"></div>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div class="main__inner" id="main-inner"></div>
  </main>

</div>

<script src="system/tokens/manifest.js"></script>
<script src="system/icons/registry-ui.js"></script>
<script src="launcher/manifest.js"></script>
<script src="launcher/launcher.js"></script>
</body>
</html>
