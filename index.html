<!DOCTYPE html>
<html lang="en" data-theme="menopause">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MHT Design System</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- Design system: universal tokens, then this site's hue family, then the
     shell's own styles. The home is a Menopause-themed page like any other; it
     documents the sites rather than switching between them. -->
<link rel="stylesheet" href="system/tokens/tokens.css" />
<link rel="stylesheet" href="system/tokens/themes/menopause.css" />
<link rel="stylesheet" href="home/home.css" />

</head>

<body data-rail="expanded">
<div class="shell">

  <nav class="rail" aria-label="Design system sections">
    <div class="rail__head">
      <span class="rail__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 2 7l10 5 10-5-10-5ZM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </span>
      <span class="rail__name">MHT<br />Design System</span>
      <button class="rail__toggle" id="rail-toggle" type="button" aria-expanded="true" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <div class="rail__nav" id="rail-nav" role="tablist" aria-label="Sections"></div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div class="main__inner" id="main-inner"></div>
  </main>

</div>

<script src="home/manifest.js"></script>
<script src="home/home.js"></script>
</body>
</html>
