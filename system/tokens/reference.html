<!DOCTYPE html>
<html lang="en" data-theme="menopause">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Token reference</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- The page documents the token layer, so it loads the token layer. Both
     themes, because it carries a switcher — per themes/README.md a switcher
     page must set data-theme explicitly, done on <html> above. -->
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="themes/menopause.css" />
<link rel="stylesheet" href="themes/legacy.css" />

<style>
  /* Page chrome only. Every value being DOCUMENTED comes from the token layer;
     these are the specimen viewer's own furniture. */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px var(--content-gutter) 80px;
    font-family: var(--font-body); color: var(--color-text);
    background: var(--color-surface); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--content-max); margin: 0 auto; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .07em;
             text-transform: uppercase; color: var(--color-accent); }
  h1 { margin: 0 0 10px; font-family: var(--font-display);
       font-size: var(--display-section-size); line-height: var(--display-section-lh);
       letter-spacing: var(--display-tracking); color: var(--color-navy); }
  .lede { margin: 0 0 28px; max-width: var(--content-column); font-size: 17px;
          line-height: 26px; color: var(--color-text-secondary); }
  .bar { display: flex; gap: 8px; align-items: center; margin: 0 0 32px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px;
          border: 1px solid var(--color-border); border-radius: var(--radius-pill);
          background: var(--color-surface); font: inherit; font-size: 13px;
          color: var(--color-text-secondary); cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--color-accent); color: var(--color-text); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  h2 { margin: 36px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .07em;
       text-transform: uppercase; color: var(--color-text); }
  .rule { height: 1px; background: var(--color-border); margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
       color: var(--color-text-secondary); font-weight: 700; padding: 0 12px 8px 0; }
  td { padding: 9px 12px 9px 0; border-top: 1px solid var(--color-border); vertical-align: middle; }
  code { font-family: var(--font-mono, "JetBrains Mono", monospace); font-size: 12.5px; }
  .name { color: var(--color-text); white-space: nowrap; }
  .val { color: var(--color-text-secondary); white-space: nowrap; }
  .note { color: var(--color-text-secondary); font-size: 13px; }
  .swatch { width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--color-card-border); flex: 0 0 34px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
         padding: 2px 6px; border-radius: var(--radius-pill); border: 1px solid var(--color-accent);
         color: var(--color-accent); white-space: nowrap; }
  .specimen { font-family: var(--font-display); color: var(--color-navy); line-height: 1.1; }
  @media (max-width: 720px) { td .note { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">MHT Design System</p>
  <h1>Token reference</h1>
  <p class="lede">
    Every token in <code>system/tokens/tokens.css</code>, rendered from the file
    itself. Values shown are what the browser actually computes, so switching
    the theme below shows the real resolved colour — not a second copy that can
    drift. Generated by <code>evals/gen-token-manifest.js</code>.
  </p>

  <div class="bar" id="themer" role="group" aria-label="Site theme"></div>
  <div id="groups"></div>
</div>

<script src="manifest.js"></script>
<script>
(function () {
  var root = document.documentElement;
  var THEMES = [{ id: 'menopause', label: 'Menopause' }, { id: 'legacy', label: 'Legacy' }];

  // Swatch colours are read back from the loaded theme files, never duplicated.
  THEMES.forEach(function (t) {
    root.setAttribute('data-theme', t.id);
    t.dot = getComputedStyle(root).getPropertyValue('--brand-accent').trim();
  });
  root.setAttribute('data-theme', 'menopause');

  var themer = document.getElementById('themer');
  themer.innerHTML = THEMES.map(function (t) {
    return '<button class="chip" type="button" data-theme="' + t.id + '" aria-pressed="' +
      (t.id === 'menopause') + '"><span class="dot" style="background:' + t.dot + '"></span>' +
      t.label + '</button>';
  }).join('');
  themer.addEventListener('click', function (e) {
    var b = e.target.closest('[data-theme]');
    if (!b) return;
    root.setAttribute('data-theme', b.dataset.theme);
    [].forEach.call(themer.children, function (x) {
      x.setAttribute('aria-pressed', String(x.dataset.theme === b.dataset.theme));
    });
    render();
  });

  var tokens = window.MHT_TOKENS || [];
  var responsive = window.MHT_TOKENS_RESPONSIVE || [];
  var host = document.getElementById('groups');

  function live(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  function isColour(v) { return /^(#|rgb|color\(|hsl)/.test(v); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render() {
    var groups = {};
    tokens.forEach(function (t) { (groups[t.group] = groups[t.group] || []).push(t); });

    host.innerHTML = Object.keys(groups).map(function (g) {
      var rows = groups[g].map(function (t) {
        var v = live(t.name) || t.value;
        var swatch = isColour(v)
          ? '<td style="width:46px"><span class="swatch" style="background:' + esc(v) + '"></span></td>'
          : '<td style="width:46px"></td>';
        var isType = /^--(display|quote)-/.test(t.name) && /px$/.test(v);
        var spec = isType
          ? '<td style="width:120px"><span class="specimen" style="font-size:' + esc(v) + '">Aa</span></td>'
          : '<td style="width:120px"></td>';
        return '<tr>' + swatch +
          '<td class="name"><code>' + esc(t.name) + '</code>' +
            (responsive.indexOf(t.name) > -1 ? ' <span class="tag">responsive</span>' : '') +
          '</td>' +
          '<td class="val"><code>' + esc(v) + '</code></td>' + spec +
          '<td class="note">' + esc(t.note) + '</td></tr>';
      }).join('');
      return '<h2>' + esc(g) + '</h2><div class="rule"></div>' +
        '<table><thead><tr><th></th><th>Token</th><th>Computed</th><th></th><th>Role</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
    }).join('');
  }

  render();
})();
</script>
</body>
</html>
