<!DOCTYPE html>
<html lang="en" data-theme="menopause">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graphics</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../tokens/tokens.css" />
<link rel="stylesheet" href="../tokens/themes/menopause.css" />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px var(--content-gutter) 80px; font-family: var(--font-body);
         color: var(--color-text); background: var(--color-surface); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: var(--content-max); margin: 0 auto; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .07em;
             text-transform: uppercase; color: var(--color-accent); }
  h1 { margin: 0 0 10px; font-family: var(--font-display); font-size: var(--display-section-size);
       line-height: var(--display-section-lh); letter-spacing: var(--display-tracking); color: var(--color-navy); }
  .lede { margin: 0 0 24px; max-width: var(--content-column); font-size: 17px; line-height: 26px;
          color: var(--color-text-secondary); }
  .bar { display: flex; gap: 8px; margin: 0 0 32px; flex-wrap: wrap; }
  .chip { padding: 7px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-pill);
          background: var(--color-surface); font: inherit; font-size: 13px;
          color: var(--color-text-secondary); cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--color-accent); color: var(--color-text); font-weight: 600; }
  h2 { margin: 34px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .07em;
       text-transform: uppercase; color: var(--color-text); }
  .rule { height: 1px; background: var(--color-border); margin: 0 0 6px; }
  .note { margin: 0 0 16px; font-size: 13.5px; line-height: 20px; color: var(--color-text-secondary);
          max-width: var(--content-column); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--color-card-border); border-radius: var(--radius-card);
          overflow: hidden; background: var(--color-surface); }
  .tile__stage { height: 132px; display: grid; place-items: center; padding: 14px;
                 background: var(--color-surface-neutral); }
  /* Checkerboard makes transparency obvious — several of these are knockouts. */
  .tile__stage--alpha {
    background-image:
      linear-gradient(45deg, var(--color-placeholder) 25%, transparent 25%),
      linear-gradient(-45deg, var(--color-placeholder) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--color-placeholder) 75%),
      linear-gradient(-45deg, transparent 75%, var(--color-placeholder) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: var(--color-surface);
  }
  .tile__stage--dark { background: var(--color-navy); }
  .tile img { max-width: 100%; max-height: 104px; display: block; }
  .tile__meta { padding: 9px 11px; border-top: 1px solid var(--color-border); }
  .tile__name { font-family: "JetBrains Mono", monospace; font-size: 11.5px; word-break: break-all;
                color: var(--color-text); }
  .tile__size { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">MHT Design System</p>
  <h1>Graphics</h1>
  <p class="lede">
    Every file in <code>system/assets/</code>, grouped by what it is for.
    Generated by <code>evals/gen-asset-manifest.js</code> — an asset that does
    not match a grouping rule is reported rather than quietly filed under
    &ldquo;Other&rdquo;.
  </p>

  <div class="bar" role="group" aria-label="Backdrop">
    <button class="chip" type="button" data-bg="alpha" aria-pressed="true">Transparency</button>
    <button class="chip" type="button" data-bg="light" aria-pressed="false">Light</button>
    <button class="chip" type="button" data-bg="dark" aria-pressed="false">Dark</button>
  </div>

  <div id="groups"></div>
</div>

<script src="manifest.js"></script>
<script>
(function () {
  var assets = window.MHT_ASSETS || [];
  var host = document.getElementById('groups');
  var bg = 'alpha';

  function kb(n) { return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render() {
    var groups = {};
    assets.forEach(function (a) { (groups[a.group] = groups[a.group] || []).push(a); });
    var stage = 'tile__stage' + (bg === 'alpha' ? ' tile__stage--alpha' : bg === 'dark' ? ' tile__stage--dark' : '');

    host.innerHTML = Object.keys(groups).map(function (g) {
      var list = groups[g];
      return '<h2>' + esc(g) + ' (' + list.length + ')</h2><div class="rule"></div>' +
        '<p class="note">' + esc(list[0].note) + '</p><div class="grid">' +
        list.map(function (a) {
          return '<a class="tile" href="' + esc(a.file) + '" target="_blank" rel="noopener">' +
            '<div class="' + stage + '"><img src="' + esc(a.file) + '" alt="" loading="lazy" /></div>' +
            '<div class="tile__meta"><div class="tile__name">' + esc(a.file) + '</div>' +
            '<div class="tile__size">' + a.ext.toUpperCase() + ' · ' + kb(a.bytes) + '</div></div></a>';
        }).join('') + '</div>';
    }).join('');
  }

  document.querySelector('.bar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-bg]'); if (!b) return;
    bg = b.dataset.bg;
    [].forEach.call(e.currentTarget.children, function (x) {
      x.setAttribute('aria-pressed', String(x.dataset.bg === bg));
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
