<!DOCTYPE html>
<html lang="en" data-theme="menopause">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docs</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../tokens/tokens.css" />
<link rel="stylesheet" href="../tokens/themes/menopause.css" />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--color-text);
         background: var(--color-surface); -webkit-font-smoothing: antialiased; }
  .shell { display: flex; min-height: 100vh; }

  .rail { flex: 0 0 258px; border-right: 1px solid var(--color-border);
          background: var(--color-surface-neutral); position: sticky; top: 0;
          height: 100vh; overflow-y: auto; padding: 20px 12px 24px; }
  .rail__back { display: inline-block; margin: 0 0 14px 8px; font-size: 13px;
                color: var(--color-primary); text-decoration: none; }
  .rail__group { margin: 16px 0 4px 8px; font-size: 11px; font-weight: 700;
                 letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); }
  .rail__link { display: block; padding: 7px 9px; border-radius: 8px; font-size: 13.5px;
                color: var(--color-text-secondary); text-decoration: none; }
  .rail__link:hover { background: var(--color-accent-soft-solid); color: var(--color-text); }
  .rail__link[aria-current="page"] { background: var(--color-surface); color: var(--color-text);
                                     font-weight: 600; box-shadow: 0 1px 2px rgb(from var(--color-text) r g b / .06); }

  .main { flex: 1; min-width: 0; padding: 40px var(--content-gutter) 90px; }
  .doc { max-width: var(--content-column); margin: 0 auto; }
  .doc__path { margin: 0 0 20px; font-family: "JetBrains Mono", monospace; font-size: 12px;
               color: var(--color-text-secondary); }
  .doc__path a { color: var(--color-primary); }

  /* Long-form reading styles, following the type scale in
     system/foundation/design.md. */
  .doc h1 { font-family: var(--font-display); font-size: var(--display-section-size);
            line-height: var(--display-section-lh); letter-spacing: var(--display-tracking);
            color: var(--color-navy); margin: 0 0 16px; }
  .doc h2 { font-family: var(--font-display); font-size: var(--display-title-size);
            line-height: var(--display-title-lh); letter-spacing: var(--display-tracking);
            color: var(--color-navy); margin: 40px 0 12px; }
  .doc h3 { font-size: 20px; font-weight: 600; letter-spacing: -.25px; margin: 30px 0 10px; }
  .doc h4 { font-size: 16px; font-weight: 700; margin: 24px 0 8px; }
  .doc p { font-size: 16.5px; line-height: 27px; margin: 0 0 16px; }
  .doc ul, .doc ol { font-size: 16.5px; line-height: 27px; margin: 0 0 16px; padding-left: 22px; }
  .doc li { margin-bottom: 7px; }
  .doc a { color: var(--color-primary); }
  .doc hr { border: 0; border-top: 1px solid var(--color-border); margin: 32px 0; }
  .doc blockquote { margin: 0 0 16px; padding: 12px 16px; border-left: 3px solid var(--color-accent);
                    background: var(--color-accent-soft-solid); border-radius: 0 8px 8px 0; }
  .doc blockquote p:last-child { margin-bottom: 0; }
  .doc code { font-family: "JetBrains Mono", monospace; font-size: 13px;
              background: var(--color-surface-sunken); padding: 1px 5px; border-radius: 4px; }
  .doc pre { background: var(--color-surface-sunken); border: 1px solid var(--color-border);
             border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0 0 16px; }
  .doc pre code { background: none; padding: 0; font-size: 12.5px; line-height: 20px; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 0 0 20px; }
  .doc th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
            color: var(--color-text-secondary); font-weight: 700; padding: 0 12px 8px 0; }
  .doc td { padding: 9px 12px 9px 0; border-top: 1px solid var(--color-border); vertical-align: top; }

  @media (max-width: 860px) {
    .shell { flex-direction: column; }
    .rail { position: static; flex: none; width: 100%; height: auto;
            border-right: 0; border-bottom: 1px solid var(--color-border); }
    .main { padding: 24px var(--content-gutter) 60px; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Documents">
    <a class="rail__back" href="../../index.html">&larr; Launcher</a>
    <div id="nav"></div>
  </nav>
  <main class="main"><article class="doc" id="doc"></article></main>
</div>

<script src="content.js"></script>
<script>
(function () {
  var docs = window.MHT_DOCS || [];
  var byPath = {};
  docs.forEach(function (d) { byPath[d.path] = d; });

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // Inline spans. Code is extracted first and parked behind a sentinel so that
  // markup inside backticks -- --color-*, <div>, **x** -- is never re-parsed.
  var MARK = '␛';
  function inline(s) {
    var stash = [];
    s = esc(s).replace(/`([^`]+)`/g, function (_, code) {
      stash.push('<code>' + code + '</code>');
      return MARK + (stash.length - 1) + MARK;
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" style="max-width:100%">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, href) {
      return '<a href="' + href + '" data-md-link>' + label + '</a>';
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s.replace(new RegExp(MARK + '(\\d+)' + MARK, 'g'), function (_, i) { return stash[i]; });
  }

  function render(md) {
    var lines = md.split('\n'), out = [], i = 0;

    function listBlock(ordered) {
      var tag = ordered ? 'ol' : 'ul', items = [];
      var re = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*]\s+(.*)$/;
      while (i < lines.length) {
        var m = lines[i].match(re);
        if (m) { items.push(m[1]); i++; }
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) {
          items[items.length - 1] += ' ' + lines[i].trim(); i++;   // wrapped continuation
        } else break;
      }
      out.push('<' + tag + '>' + items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</' + tag + '>');
    }

    while (i < lines.length) {
      var line = lines[i];

      if (/^```/.test(line)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|[-:\s|]+\|\s*$/.test(lines[i + 1] || '')) {
        var head = line.split('|').slice(1, -1).map(function (c) { return c.trim(); });
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          rows.push(lines[i].split('|').slice(1, -1).map(function (c) { return c.trim(); }));
          i++;
        }
        out.push('<table><thead><tr>' + head.map(function (h) { return '<th>' + inline(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
        continue;
      }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
      if (/^\s*(---|___|\*\*\*)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^\s*>/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + render(q.join('\n')) + '</blockquote>');
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)) { listBlock(false); continue; }
      if (/^\s*\d+\.\s+/.test(line)) { listBlock(true); continue; }
      if (!line.trim()) { i++; continue; }

      var para = [];
      while (i < lines.length && lines[i].trim() &&
             !/^(#{1,6}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*>|\s*\|)/.test(lines[i]) &&
             !/^\s*(---|___|\*\*\*)\s*$/.test(lines[i])) { para.push(lines[i]); i++; }
      if (para.length) out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  var ORDER = ['Foundations', 'Components', 'Brand', 'Product', 'Prototypes', 'Decisions', 'Skills', 'Root'];
  var nav = document.getElementById('nav');
  nav.innerHTML = ORDER.map(function (sec) {
    var list = docs.filter(function (d) { return d.section === sec; });
    if (!list.length) return '';
    return '<p class="rail__group">' + sec + '</p>' + list.map(function (d) {
      return '<a class="rail__link" href="?doc=' + encodeURIComponent(d.path) + '" data-path="' +
        esc(d.path) + '">' + esc(d.title) + '</a>';
    }).join('');
  }).join('');

  function current() {
    var q = new URLSearchParams(location.search).get('doc');
    return (q && byPath[q]) ? q : 'MANUAL.md';
  }

  function show(p) {
    var d = byPath[p];
    var host = document.getElementById('doc');
    if (!d) { host.innerHTML = '<p>Not found: ' + esc(p) + '</p>'; return; }

    host.innerHTML = '<p class="doc__path"><a href="../../' + esc(d.path) + '">' + esc(d.path) + '</a></p>' + render(d.markdown);

    // Markdown links are relative to the DOC's folder, not this viewer.
    // Another inlined .md opens here; anything else resolves against the root.
    var dir = d.path.indexOf('/') > -1 ? d.path.slice(0, d.path.lastIndexOf('/')) : '';
    host.querySelectorAll('a[data-md-link]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (/^(https?:|mailto:|#)/.test(href)) return;
      var stack = [];
      ((dir ? dir + '/' : '') + href.split('#')[0]).split('/').forEach(function (seg) {
        if (seg === '.' || seg === '') return;
        if (seg === '..') stack.pop(); else stack.push(seg);
      });
      var target = stack.join('/');
      a.setAttribute('href', byPath[target] ? '?doc=' + encodeURIComponent(target) : '../../' + target);
    });

    nav.querySelectorAll('.rail__link').forEach(function (a) {
      if (a.dataset.path === p) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    document.title = d.title + ' — Docs';
    window.scrollTo(0, 0);
  }

  window.addEventListener('popstate', function () { show(current()); });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="?doc="]');
    if (!a) return;
    e.preventDefault();
    history.pushState(null, '', a.getAttribute('href'));
    show(current());
  });

  show(current());
})();
</script>
</body>
</html>
